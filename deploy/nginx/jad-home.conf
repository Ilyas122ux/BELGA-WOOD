limit_req_zone $binary_remote_addr zone=jad_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root /opt/jad-home/current/client/dist;
    index index.html;
    client_max_body_size 55m;
    server_tokens off;

    include /etc/nginx/snippets/jad-home-security.conf;

    location = /api/auth/login {
        limit_req zone=jad_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        include /etc/nginx/snippets/jad-home-security.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_no_cache 1;
        include /etc/nginx/snippets/jad-home-security.conf;
        add_header Cache-Control "no-store" always;
    }

    location /uploads/ {
        alias /srv/jad-home/data/uploads/;
        access_log off;
        include /etc/nginx/snippets/jad-home-security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        include /etc/nginx/snippets/jad-home-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /admin {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/jad-home-security.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/jad-home-security.conf;
        add_header Cache-Control "no-cache" always;
    }

    error_page 502 503 504 =503 /503.html;
    location = /503.html {
        root /var/www/jad-home-errors;
        internal;
    }
}
